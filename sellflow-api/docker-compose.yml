version: "3.9"

services:

  app:
    build: .
    container_name: laravel-api
    restart: unless-stopped
    ports:
      - "8000:10000"
    env_file:
      - .env
    environment:
      PORT: 10000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sellflow_db
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0

    container_name: laravel-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: sellflow_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
