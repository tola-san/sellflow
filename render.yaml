services:
  - type: web
    name: sellflow-api
    runtime: docker
    rootDir: sellflow-api
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: SellFlow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: DB_URL
        fromDatabase:
          name: sellflow-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: sellflow-db
          property: host
      - key: DB_DATABASE
        fromDatabase:
          name: sellflow-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sellflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sellflow-db
          property: password
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        sync: false
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
      - key: RUN_MIGRATIONS
        value: "true"
      - key: BILLING_TRIAL_DAYS
        value: "30"
      - key: BILLING_TRIAL_PLAN
        value: growth
      - key: PRODUCT_IMAGE_DISK
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: sellflow-reverb
    runtime: docker
    rootDir: sellflow-api
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan reverb:start --host=0.0.0.0 --port=10000
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: SellFlow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        sync: false
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
      - key: REVERB_SERVER_HOST
        value: 0.0.0.0
      - key: REVERB_SERVER_PORT
        value: "10000"
      - key: REVERB_ALLOWED_ORIGINS
        sync: false
      - key: REVERB_SCALING_ENABLED
        value: "false"

  - type: worker
    name: sellflow-queue
    runtime: docker
    rootDir: sellflow-api
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_NAME
        value: SellFlow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: DB_URL
        fromDatabase:
          name: sellflow-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        sync: false
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https

databases:
  - name: sellflow-db
    plan: free
    region: singapore
    databaseName: sellflow
    user: sellflow
